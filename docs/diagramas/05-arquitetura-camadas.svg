" y="325.625">chama casos de uso</text><!--link APP to DOM--><path d="M447.96,466.17 C410.01,492.99 363.59,525.78 323.75,553.94 " fill="none" id="APP-DOM" style="stroke: #5A3E2B; stroke-width: 1.0;"/><polygon fill="#5A3E2B" points="319.42,556.99,329.0834,555.0876,323.5108,554.115,324.4834,548.5424,319.42,556.99" style="stroke: #5A3E2B; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="74" x="405.5" y="516.125">aplica regras</text><!--link APP to INF--><path d="M509.03,466.07 C506.73,486.53 508.08,509.27 519.5,527 C530.24,543.68 544.92,557.31 561.46,568.43 " fill="none" id="APP-INF" style="stroke: #5A3E2B; stroke-width: 1.0;"/><polygon fill="#5A3E2B" points="565.7,571.2,560.3449,562.9343,561.5114,568.4695,555.9761,569.6361,565.7,571.2" style="stroke: #5A3E2B; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="153" x="520.5" y="516.125">persistência e adaptadores</text><!--link APP to INF--><path d="M649.66,469.19 C660.3,477.14 670.16,486.05 678.5,496 C696.3,517.22 706.02,546.71 711.31,571.27 " fill="none" id="APP-INF-1" style="stroke: #5A3E2B; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#5A3E2B" points="645.38,466.07,650.2827,474.6119,649.4156,469.0219,655.0057,468.1548,645.38,466.07" style="stroke: #5A3E2B; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="110" x="709.5" y="508.625">implementa a porta</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="132" x="698.5" y="523.1445">GatewayDePagamento</text><!--link INF to DB--><path d="M694.3,664.76 C678.32,696.28 657.47,737.41 643.13,765.7 " fill="none" id="INF-DB" style="stroke: #5A3E2B; stroke-width: 1.0;"/><polygon fill="#5A3E2B" points="640.71,770.47,648.3446,764.248,642.9689,766.0094,641.2075,760.6337,640.71,770.47" style="stroke: #5A3E2B; stroke-width: 1.0;"/><!--link INF to PSP--><path d="M740.44,664.76 C756.15,696.08 776.62,736.9 790.79,765.17 " fill="none" id="INF-PSP" style="stroke: #5A3E2B; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#5A3E2B" points="793.18,769.94,792.7076,760.1025,790.9325,765.4736,785.5614,763.6985,793.18,769.94" style="stroke: #5A3E2B; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="107" x="777.5" y="721.625">cobrança / estorno</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="59" x="801.5" y="736.1445">(simulado)</text><!--
@startuml 05-arquitetura-camadas
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 12
skinparam ArrowColor #5A3E2B
skinparam rectangle {
  BorderColor #5A3E2B
  FontColor #2B1D14
}
skinparam actor {
  BorderColor #7A1F2B
  BackgroundColor #FFF3D6
}

actor "Clientes da API\nApp · Totem · Web · Balcão" as Clientes

rectangle "**API (Interface)** — src/api\n\nControllers REST: /auth /usuarios /unidades /produtos /estoque\n/pedidos /pagamentos /fidelidade /campanhas /relatorios /auditoria /health\nAutenticacaoGuard (JWT + perfis) · DTOs + ValidationPipe (422)\nFiltroDeErros (JSON padrão) · ContextoMiddleware (requestId) · Swagger (/docs)" as API #FFF3E0

rectangle "**Application (Casos de uso)** — src/application\n\nPedidosService · PagamentosService (+ timeout/retry) · EstoqueService\nFidelidadeService · UsuariosService (LGPD) · CatalogoService\nCampanhasService · RelatoriosService · AuthService · AuditoriaService\nPorta: GatewayDePagamento (interface)" as APP #FFF8EC

rectangle "**Domain (Regras de negócio puras)** — src/domain\n\nMáquina de status do pedido · Canal × perfil (multicanalidade)\nCálculo do pedido · Fidelidade por níveis · Campanhas segmentadas\nFormato da unidade e regiões · Sazonalidade · Idade e mascaramento (LGPD)\nEnums · ErroDeDominio\n(sem dependência de framework, HTTP ou banco)" as DOM #FFFDF8

rectangle "**Infrastructure (Detalhes técnicos)** — src/infrastructure\n\nEntidades TypeORM · Migrations · Seed · UnidadeDeTrabalho (transações)\nGatewayDePagamentoMock (RaizesPay Sandbox) · Hash bcrypt\nLimitador de login · Contexto da requisição · Configuração (.env)" as INF #F7EFE6

database "SQLite\n(arquivo, via sql.js)" as DB
cloud "Provedor de pagamento\n(externo — simulado)" as PSP

Clientes -down-> API : HTTP/JSON + Bearer JWT
API -down-> APP : chama casos de uso
APP -down-> DOM : aplica regras
APP -down-> INF : persistência e adaptadores
INF .up.> APP : implementa a porta\nGatewayDePagamento
INF -down-> DB
INF .down.> PSP : cobrança / estorno\n(simulado)
@enduml

